# Configuration file for `prek`, a git hook framework written in Rust.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"
default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "mixed-line-ending" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "biome-check",
    name = "Biome check",
    language = "system",
    entry = "bunx --bun @biomejs/biome check --write --files-ignore-unknown=true --no-errors-on-unmatched",
    files = "\\.(astro|svelte|[cm]?[jt]sx?|jsonc?|css)$",
  },
  {
    id = "astro-check",
    name = "Astro check",
    language = "system",
    entry = "bun run check",
    files = "\\.(astro|svelte|[cm]?tsx?)$|^(astro|svelte|uno|vite|vitest)\\.config\\.[cm]?[jt]s$|^tsconfig\\.json$|^package\\.json$",
    pass_filenames = false,
  },
  {
    id = "svelte-check",
    name = "Svelte check",
    language = "system",
    entry = "bunx --bun svelte-check --threshold warning",
    files = "\\.(svelte|[cm]?tsx?)$|^(svelte|vite|vitest)\\.config\\.[cm]?[jt]s$|^tsconfig\\.json$|^package\\.json$",
    pass_filenames = false,
  },
]
