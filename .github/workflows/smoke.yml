# Tier-1 smoke test: boot the app and prove real routes load.
#
# Deliberately NOT a browser test. It verifies that the app boots and serves
# real content. It will NOT catch client-side breakage: a server-rendered page
# returns 200 with a valid <title> even when a svelte bump has broken island
# hydration. Upgrading to a real browser test is a separate decision, not
# something to bolt on here.
#
# This repo serves via `astro dev`, not `astro preview`, because the Vercel
# adapter refuses preview outright:
#   [preview] The @astrojs/vercel adapter does not support the preview command.
# That makes this a weaker signal than the static repos get — the dev server,
# not the production bundle. The production compile is already covered: code-quality.yml
# runs `bun run build` on every push and pull request.
name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only throughout. Unlike code-quality.yml there is no write-capable job
# here, and no biome-migrate job — that belongs solely to the quality gate.
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Serve · load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Derived from the committed `packageManager` field, not `latest`.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No environment variables are supplied on purpose: with no relay
      # credentials the app falls back to the in-memory relay documented in
      # .env.example, which is exactly what this Tier-1 check wants to exercise.
      - name: Serve and smoke-test routes
        run: |
          set -euo pipefail

          # `--host 127.0.0.1` is explicit on purpose: Astro otherwise binds the
          # name `localhost`, which can resolve to ::1 first, while the probes
          # below dial IPv4 literally.
          #
          # Astro 7 runs `astro dev` as a managed daemon: the command below can
          # return as soon as the server is up, leaving it running in the
          # background, and only `astro dev stop` shuts that down. It may also
          # stay in the foreground. This handles both — backgrounding covers the
          # foreground case, and the trap performs both kinds of cleanup, with
          # whichever one does not apply being a harmless no-op. Do not
          # "simplify" it to only `kill` or only `stop`: each alone silently
          # fails to clean up in one of the two modes, and a surviving daemon
          # holds this step's stdout open, which hangs the job until its timeout.
          #
          # Server output is redirected to a file for the same reason: a
          # background process inheriting the step's stdout keeps the runner
          # waiting on the pipe even after the script itself has finished.
          bun run dev -- --host 127.0.0.1 --port 4321 >"${RUNNER_TEMP}/dev.log" 2>&1 &
          server=$!
          trap 'bunx astro dev stop >/dev/null 2>&1; kill "${server}" 2>/dev/null || true' EXIT

          # Readiness loop, deliberately NOT `curl --retry`: this distinguishes
          # "not up yet" from "up but broken", so a real 500 fails fast instead
          # of being retried into a timeout. The server log is printed on failure,
          # since it is no longer on the step's own stdout.
          timeout 90 bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:4321/; do sleep 1; done' \
            || { echo "SMOKE FAILED: dev server never became ready"; cat "${RUNNER_TEMP}/dev.log"; exit 1; }

          # Assert on CONTENT, not just status — a 200 error page would sail
          # through a status-only check.
          #
          # The body goes to a file rather than into `curl ... | grep -q`:
          # grep -q exits at the first match, curl then dies of SIGPIPE with
          # exit 23, and `pipefail` turns that into a failure. Whether it trips
          # depends on response size and timing, so the piped form is
          # intermittently red rather than reliably broken.
          for path in / /local/session /local/display; do
            echo "==> ${path}"
            curl -fsS -m 10 -o "${RUNNER_TEMP}/page.html" "http://127.0.0.1:4321${path}"
            grep -q '<title>' "${RUNNER_TEMP}/page.html" \
              || { echo "SMOKE FAILED: ${path} served no <title>"; exit 1; }
          done

          # The health endpoint is the one API route worth smoking: it needs no
          # session and no credentials. Assert on the `relay` key rather than on
          # `"ok":true` — with no Redis configured the payload is legitimately
          # {"ok":false,"relay":"memory",...}, so `ok` is the wrong thing to gate
          # on. Finding `relay` proves a real health payload, not an error body.
          echo "==> /api/session/health"
          curl -fsS -m 10 -o "${RUNNER_TEMP}/health.json" http://127.0.0.1:4321/api/session/health
          cat "${RUNNER_TEMP}/health.json"
          grep -q '"relay"' "${RUNNER_TEMP}/health.json" \
            || { echo "SMOKE FAILED: health endpoint returned no relay field"; exit 1; }
